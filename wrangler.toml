name = "cdcitas"
main = "src/index.js"
compatibility_date = "2025-09-01"
# nodejs_compat: lo pide worker-mailer (envía el correo de confirmación por SMTP usando
# el socket TCP de Workers) — ver src/lib/mailer.js.
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./public"
binding = "ASSETS"
# Por defecto, si la URL calza con un archivo real, Cloudflare lo sirve directo sin pasar por el
# Worker. "/admin" calza con admin.html (el panel de un negocio) por la resolución sin extensión,
# así que necesita pasar primero por el Worker, que responde 404: sin negocio no hay panel (los
# negocios se crean desde Diwilo Web, ver src/routes/platform.js).
#
# Secreto (wrangler secret put PLATFORM_KEY): clave compartida con Diwilo Web para /api/platform/*.
run_worker_first = ["/admin"]

[[d1_databases]]
binding = "DB"
database_name = "control-de-citas-db"
database_id = "2b827e45-bfef-4646-bbc3-23ffe75c9534"

# Fotos de servicios (y lo que se agregue después) — se sirven a través del propio Worker
# (GET /api/:slug/public/files/:name), no del dominio público de R2.
[[r2_buckets]]
binding = "FILES"
bucket_name = "cdcitas-files"

# Manda los recordatorios de cita vencidos (ver src/index.js#scheduled y src/lib/reminders.js).
[triggers]
crons = ["*/15 * * * *"]
