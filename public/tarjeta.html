<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tarjeta digital</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="/styles.css" rel="stylesheet">
</head>
<body>

<div id="noTenant" class="container py-5" style="display:none;">
  <div class="card-panel p-4 text-center mx-auto" style="max-width:460px;">
    <p class="text-muted mb-0">Esta página necesita el enlace de tu negocio, algo como <code>/tu-negocio/tarjeta</code>.</p>
  </div>
</div>

<div id="cardWrap" class="container py-5" style="display:none;max-width:440px;">

  <div class="text-center mb-4">
    <div class="mx-auto mb-3" id="bizMark" style="width:88px;height:88px;border-radius:50%;overflow:hidden;background:var(--primary);display:flex;align-items:center;justify-content:center;color:#fff;font-size:2rem;">
      <i class="bi bi-calendar2-heart"></i>
    </div>
    <h1 class="h4 fw-bold display-font mb-1" id="bizName"></h1>
    <p class="text-muted mb-0" id="bizBio" style="display:none;"></p>
  </div>

  <a class="btn btn-brand w-100 py-3 mb-3 fw-bold" id="bookBtn" href="#">
    <i class="bi bi-calendar2-check"></i> Reservar cita
  </a>

  <div id="infoCard" class="card-panel p-3 mb-3" style="display:none;">
    <div id="addressRow" class="d-flex align-items-start gap-2 mb-2" style="display:none;">
      <i class="bi bi-geo-alt-fill" style="color:var(--primary);"></i>
      <a class="text-decoration-none text-body small" id="addressLink" href="#" target="_blank" rel="noopener"></a>
    </div>
    <div id="hoursRow" class="d-flex align-items-start gap-2">
      <i class="bi bi-clock-fill" style="color:var(--primary);"></i>
      <span class="small" id="hoursText"></span>
    </div>
  </div>

  <div id="featuredWrap" class="mb-3" style="display:none;">
    <p class="label-xs mb-2">Servicios destacados</p>
    <div id="featuredList" class="d-flex flex-column gap-2 mb-2"></div>
    <a class="btn btn-outline-dark w-100 btn-sm" id="seeMoreServicesBtn" href="#">Ver más servicios</a>
  </div>

  <div id="linksList" class="d-flex flex-column gap-2 mb-4"></div>

</div>

<script src="/app.js"></script>
<script>
const { api, tenantSlug, dateToISO } = window.CDC;

const SERVICE_THEMES = [
  { gradient: "linear-gradient(135deg,#8a6b4f,#c9a37a)", icon: "bi-flower2" },
  { gradient: "linear-gradient(135deg,#3d4a52,#7d97a3)", icon: "bi-scissors" },
  { gradient: "linear-gradient(135deg,#4a3327,#8a5b3d)", icon: "bi-magic" },
];

const sourceCode = new URLSearchParams(location.search).get("src") || null;

// Registro de vistas/clicks best-effort: nunca debe frenar la navegación de quien visita la
// tarjeta, por eso no se espera la respuesta antes de seguir (ni siquiera en los clicks).
function track(eventType, target) {
  api("/public/card/track", { method: "POST", body: { sourceCode, eventType, target } }).catch(() => {});
}

async function init() {
  if (!tenantSlug()) { document.getElementById("noTenant").style.display = "block"; return; }
  const card = await api("/public/card").catch(() => null);
  if (!card) { document.getElementById("noTenant").style.display = "block"; return; }

  document.getElementById("cardWrap").style.display = "block";
  document.getElementById("bizName").textContent = card.name;
  if (card.logoKey) {
    document.getElementById("bizMark").innerHTML = `<img src="/api/${tenantSlug()}/public/files/${card.logoKey}" style="width:100%;height:100%;object-fit:cover;">`;
  }
  if (card.bio) {
    const bio = document.getElementById("bizBio");
    bio.textContent = card.bio;
    bio.style.display = "block";
  }

  const bookBtn = document.getElementById("bookBtn");
  bookBtn.href = `/${tenantSlug()}`;
  bookBtn.onclick = () => track("click", "reservar");

  document.getElementById("infoCard").style.display = "block";
  if (card.address) {
    const row = document.getElementById("addressRow");
    const link = document.getElementById("addressLink");
    link.textContent = card.address;
    link.href = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(card.address)}`;
    link.onclick = () => track("click", "ubicacion");
    row.style.display = "flex";
  }
  document.getElementById("hoursText").textContent = hoursText(card.openDays, card.openHour, card.closeHour);

  if (card.featuredServices.length) {
    document.getElementById("featuredWrap").style.display = "block";
    document.getElementById("featuredList").innerHTML = card.featuredServices.map((s, i) => {
      const theme = SERVICE_THEMES[i % SERVICE_THEMES.length];
      const photoUrl = s.photo_key ? `/api/${tenantSlug()}/public/files/${s.photo_key}` : null;
      return `
        <div class="d-flex align-items-center gap-3 card-panel p-2">
          <div style="width:52px;height:52px;border-radius:10px;flex-shrink:0;background:${photoUrl ? `url('${photoUrl}') center/cover` : theme.gradient};display:flex;align-items:center;justify-content:center;color:#fff;">
            ${photoUrl ? "" : `<i class="bi ${theme.icon}"></i>`}
          </div>
          <div class="flex-grow-1">
            <div class="fw-semibold small">${s.name}</div>
            <div class="text-muted small">${s.duration_min} min · $${s.price}</div>
          </div>
          <a class="btn btn-sm btn-outline-dark flex-shrink-0" data-see-service="${s.name}" href="/${tenantSlug()}?service=${s.id}">Ver</a>
        </div>`;
    }).join("");
    document.querySelectorAll("[data-see-service]").forEach((el) => (el.onclick = () => track("click", `servicio: ${el.dataset.seeService}`)));
  }
  const seeMoreBtn = document.getElementById("seeMoreServicesBtn");
  seeMoreBtn.href = `/${tenantSlug()}`;
  seeMoreBtn.onclick = () => track("click", "ver-mas-servicios");

  document.getElementById("linksList").innerHTML = card.links.map((l) => `
    <a class="d-flex align-items-center gap-3 card-panel p-3 text-decoration-none text-body" data-link-label="${l.label}" href="${l.url}" target="_blank" rel="noopener">
      <i class="bi ${l.icon || "bi-link-45deg"}" style="font-size:1.2rem;color:var(--primary);"></i>
      <span class="fw-semibold small">${l.label}</span>
    </a>`).join("");
  // El nombre del link (ej. "Instagram") queda como target del click, no su id — así en la
  // analítica del panel se ve de una qué tocaron, en vez de un uuid ilegible.
  document.querySelectorAll("[data-link-label]").forEach((el) => (el.onclick = () => track("click", el.dataset.linkLabel)));

  track("view", null);
}

function hoursText(openDays, openHour, closeHour) {
  const dows = ["Dom", "Lun", "Mar", "Mié", "Jue", "Vie", "Sáb"];
  const to12h = (h) => { const ap = h >= 12 ? "PM" : "AM"; let h12 = h % 12; if (h12 === 0) h12 = 12; return `${h12}${ap}`; };
  const sorted = [...openDays].sort();
  const days = sorted.length === 7 ? "Todos los días" : sorted.map((d) => dows[d]).join(", ");
  return `${days} · ${to12h(openHour)} - ${to12h(closeHour)}`;
}

init();
</script>
</body>
</html>
